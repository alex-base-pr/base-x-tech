name: QA

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa/report
            qa/screens
          retention-days: 14
